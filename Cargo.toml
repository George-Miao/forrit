[workspace]
members = ["clients/rust", "packages/*"]
resolver = "2"

[workspace.package]
authors = ["George Miao <gm@miao.dev>"]
edition = "2024"
version = "0.4.0"

[workspace.dependencies]
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"] }
serde = "1.0.229"
bangumi-data = "0.2.0"
chrono = "0.4.45"
regex = "1.13.1"
tracing = "0.1.44"
tap = "1.0.1"
tokio = "1.54.1"
serde_json = "1.0.154"
base64 = "0.23.1"
either = "1.19.0"
salvo_core = "1.2.1"
unicode-normalization = "0.1.26"
arc-swap = "1.9.5"

forrit-core = { version = "0.4.0", path = "packages/core" }
forrit-config = { version = "0.4.0", path = "packages/config" }

ts-rs = { version = "11.1.0", features = ["no-serde-warnings"] }
futures = { version = "0.3.34", default-features = false, features = ["async-await", "std"] }
bson = { version = "3.1.0", features = ["chrono-0_4", "serde"] }
salvo-oapi = { version = "1.2.1", features = ["chrono"] }
tmdb-api = { version = "1.0.0-alpha.5", git = "https://github.com/George-Miao/tmdb-api.git", rev = "5d1be70" }
iso8601 = { version = "0.6.6", features = ["chrono"] }
camino = { version = "1.2.6", features = ["serde1"] }
url = { version = "2.5.8", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
