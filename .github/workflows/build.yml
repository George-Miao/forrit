name: Build & Publish
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/**"
      - "clients/**"
      - "frontend/**"
      - "flake.nix"
      - "flake.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - name: Build Frontend
        run: |
          pnpm --dir clients/typescript install --no-frozen-lockfile
          pnpm --dir clients/typescript build
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          source_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$source_dir"
          rm -rf "$source_dir/frontend/build/client"
          cp -a frontend/build/client "$source_dir/frontend/build/client"
          nix build "path:$source_dir#forrit-server-docker"
          SHA_SHORT="${GITHUB_SHA::7}"
          VERSION_TAG=$(git tag --points-at "$GITHUB_SHA" --list "v*" --sort=-version:refname | head -n 1)
          IMAGE="${{ env.REGISTRY }}/george-miao/forrit"
          nix-shell -p skopeo --command "skopeo --insecure-policy copy docker-archive:$(readlink -f ./result) docker://$IMAGE:$SHA_SHORT --dest-compress-format zstd"
          nix-shell -p skopeo --command "skopeo --insecure-policy copy docker-archive:$(readlink -f ./result) docker://$IMAGE:latest --dest-compress-format zstd"
          if [[ -n "$VERSION_TAG" ]]; then
            nix-shell -p skopeo --command "skopeo --insecure-policy copy docker-archive:$(readlink -f ./result) docker://$IMAGE:$VERSION_TAG --dest-compress-format zstd"
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
