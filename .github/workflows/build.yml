name: Build & Publish
on:
  push:
    branches:
      - main
    paths:
      - "packages/"
      - "clients/"
      - "frontend/app"
      - "frontend/*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix Magic Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.7.0

      - name: Build Frontend
        run: |
          cd frontend
          pnpm i
          pnpm run build

      - name: Detect file change
        id: files-changes
        run: |
          set +e
          git add frontend/build
          git diff --quiet --exit-code frontend/build
          changed=$?
          echo "changed=$changed" >> $GITHUB_OUTPUT
          [[ $changed = 0 ]] && echo "Nothing changed, early exiting" && exit 0
          echo "Changed, commit & push"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/build
          git commit -m "chore(frontend): rebuild"

      - name: Push changes
        if: "${{ steps.files-changes.outputs.changed == 1 }}"
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          nix build ".#forrit-server-docker"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/george-miao/forrit"
          nix-shell -p skopeo --command "skopeo --insecure-policy copy docker-archive:$(readlink -f ./result) docker://$IMAGE:$SHA_SHORT --dest-compress-format zstd"
          nix-shell -p skopeo --command "skopeo --insecure-policy copy docker-archive:$(readlink -f ./result) docker://$IMAGE:latest --dest-compress-format zstd"
